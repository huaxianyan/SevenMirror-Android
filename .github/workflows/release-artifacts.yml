name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-sign-and-attest:
    runs-on: ubuntu-latest
    environment: release-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify immutable GitHub Action pins
        run: |
          if grep -RPn '^\s*(?:-\s*)?uses:\s+(?!\./)[^@\s]+@(?![0-9a-f]{40}(?:\s|$))' .github/workflows; then
            echo 'Every external GitHub Action must use an immutable 40-character commit.' >&2
            exit 1
          fi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Kotlin advisory guard
        run: bash .github/scripts/gradle-step.sh verifyKotlinKaptAdvisoryGuard
      - name: Verify release tag binding
        if: github.ref_type == 'tag'
        run: |
          version_name="$(grep '^versionName=' release/release-identity.properties | cut -d= -f2-)"
          test "$GITHUB_REF_NAME" = "v${version_name}"
          case "$version_name" in
            *-dev) echo 'Development Android versions cannot be released by tag.' >&2; exit 1 ;;
          esac
      - name: Verify release source and dependency inventories
        run: |
          test -z "$(git status --porcelain=v1)"
          bash .github/scripts/gradle-step.sh \
            :app:dependencies \
            :core-crypto:dependencies \
            :core-notification:dependencies \
            :core-protocol:dependencies \
            :core-transport:dependencies \
            writeReleaseRuntimeDependencyInventory \
            --write-locks
          if [[ -n "$(git status --porcelain -- ':(glob)**/gradle.lockfile')" ]]; then
            echo 'Gradle dependency inventories are incomplete or stale.' >&2
            git status --short -- ':(glob)**/gradle.lockfile'
            exit 1
          fi
          bash .github/scripts/gradle-step.sh verifyVendoredProtocol test lint
          python3 scripts/test_android_osv_evidence.py
      - name: Generate verified OSV query evidence
        run: |
          config=security/osv-scanner.json
          scanner_version="$(jq -er '.version' "$config")"
          scanner_sha256="$(jq -er '.linux_amd64_sha256' "$config")"
          scanner="$RUNNER_TEMP/osv-scanner"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${scanner_version}/osv-scanner_linux_amd64"
          echo "${scanner_sha256}  ${scanner}" | sha256sum --check --strict -
          chmod 0700 "$scanner"
          python3 scripts/android_osv_evidence.py \
            --scanner "$scanner" \
            --output "$RUNNER_TEMP/sevenmirror-android-osv-evidence" \
            --revision "$GITHUB_SHA"
      - name: Prepare fixed signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/sevenmirror-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/sevenmirror-signing/sevenmirror-android.jks"
          chmod 600 "$RUNNER_TEMP/sevenmirror-signing/sevenmirror-android.jks"
      - name: Build fixed-signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/sevenmirror-signing/sevenmirror-android.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: bash .github/scripts/gradle-step.sh assembleRelease
      - name: Build and verify release artifact set
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | sort | tail -1)
          python3 scripts/test_build_release_artifacts.py
          python3 scripts/build_release_artifacts.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --output "$RUNNER_TEMP/sevenmirror-android-release" \
            --revision "$GITHUB_SHA" \
            --apksigner "$APKSIGNER" \
            --apkanalyzer "$APKANALYZER"
      - name: Generate signed OSV evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/sevenmirror-android-osv-evidence/*'
      - name: Generate signed GitHub provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '${{ runner.temp }}/sevenmirror-android-release/*'
      - name: Upload verified OSV query evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sevenmirror-android-osv-evidence-${{ github.sha }}
          path: '${{ runner.temp }}/sevenmirror-android-osv-evidence/'
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified release artifact set
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sevenmirror-android-${{ github.sha }}
          path: '${{ runner.temp }}/sevenmirror-android-release/'
          if-no-files-found: error
          retention-days: 30
      - name: Remove reconstructed signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/sevenmirror-signing"
