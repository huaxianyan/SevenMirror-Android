name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify protocol
        run: bash .github/scripts/gradle-step.sh verifyVendoredProtocol
      - name: Unit tests
        run: bash .github/scripts/gradle-step.sh test
      - name: Lint
        run: bash .github/scripts/gradle-step.sh lint
      - name: Prepare fixed signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/syncnotifications-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/syncnotifications-signing/syncnotifications-android.jks"
            chmod 600 "$RUNNER_TEMP/syncnotifications-signing/syncnotifications-android.jks"
          fi
      - name: Build APKs
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/syncnotifications-signing/syncnotifications-android.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -f "$ANDROID_SIGNING_STORE_FILE" ]]; then
            bash .github/scripts/gradle-step.sh assembleDebug assembleRelease
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'Fixed signing secrets unavailable to this pull request; building CI debug APK only.'
            unset ANDROID_SIGNING_STORE_FILE
            bash .github/scripts/gradle-step.sh assembleDebug
          else
            echo 'Fixed signing secrets are required for push builds.' >&2
            exit 1
          fi
      - name: Verify fixed signing certificate
        env:
          EXPECTED_CERT_SHA256: 3e422af3d30a5a4083b48f7ca5b1311be2af8fcf6187fd02a8541d3052f28f70
        run: |
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          if [[ -f "$RELEASE_APK" ]]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" \
              | tee "$RUNNER_TEMP/apksigner-output.txt"
            grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" \
              "$RUNNER_TEMP/apksigner-output.txt"
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: syncnotifications-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  api29-secure-action-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run crypto and notification-action instrumentation on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :core-crypto:connectedDebugAndroidTest :core-notification:connectedDebugAndroidTest --console=plain
