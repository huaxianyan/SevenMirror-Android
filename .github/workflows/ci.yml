name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify protocol
        run: bash .github/scripts/gradle-step.sh verifyVendoredProtocol
      - name: Unit tests
        run: bash .github/scripts/gradle-step.sh test
      - name: Lint
        run: bash .github/scripts/gradle-step.sh lint
      - name: Build debug APK
        run: bash .github/scripts/gradle-step.sh assembleDebug

  api29-crypto-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run crypto instrumentation on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :core-crypto:connectedDebugAndroidTest --console=plain
