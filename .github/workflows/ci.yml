name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Verify protocol
        run: bash .github/scripts/gradle-step.sh verifyVendoredProtocol
      - name: Unit tests
        run: bash .github/scripts/gradle-step.sh test
      - name: Lint
        run: bash .github/scripts/gradle-step.sh lint
      - name: Build debug APK
        run: bash .github/scripts/gradle-step.sh assembleDebug
