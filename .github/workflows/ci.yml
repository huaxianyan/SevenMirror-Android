name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  release-runtime-vulnerability-gate:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=gradle/release-runtime/gradle.lockfile
      upload-sarif: false
      fail-on-vuln: true
      matrix-property: release-runtime-

  complete-supply-chain-vulnerability-audit:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --lockfile=gradle/verification-metadata.xml
      upload-sarif: false
      fail-on-vuln: false
      matrix-property: supply-chain-

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify immutable GitHub Action pins
        run: |
          if grep -RPn '^\s*(?:-\s*)?uses:\s+(?!\./)[^@\s]+@(?![0-9a-f]{40}(?:\s|$))' .github/workflows; then
            echo 'Every external GitHub Action must use an immutable 40-character commit.' >&2
            exit 1
          fi
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Verify dependency inventories
        run: |
          bash .github/scripts/gradle-step.sh \
            :app:dependencies \
            :core-crypto:dependencies \
            :core-notification:dependencies \
            :core-protocol:dependencies \
            :core-transport:dependencies \
            writeReleaseRuntimeDependencyInventory \
            --write-locks
          if [[ -n "$(git status --porcelain -- ':(glob)**/gradle.lockfile')" ]]; then
            echo 'Gradle dependency inventories are incomplete or stale.' >&2
            git status --short -- ':(glob)**/gradle.lockfile'
            exit 1
          fi
      - name: Verify project license
        run: |
          echo '3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  LICENSE' | sha256sum --check -
          grep -Fq 'GPL-3.0-only' LICENSE-TRANSITION.md
          grep -Fq 'fbfd370e11730d250d8d3dd6cc9fdfeebea7b0b7' LICENSE-TRANSITION.md
      - name: Verify protocol
        run: bash .github/scripts/gradle-step.sh verifyVendoredProtocol
      - name: Unit tests
        run: bash .github/scripts/gradle-step.sh test
      - name: Lint
        run: bash .github/scripts/gradle-step.sh lint
      - name: Prepare fixed signing identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            mkdir -p "$RUNNER_TEMP/syncnotifications-signing"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" \
              | base64 --decode \
              > "$RUNNER_TEMP/syncnotifications-signing/syncnotifications-android.jks"
            chmod 600 "$RUNNER_TEMP/syncnotifications-signing/syncnotifications-android.jks"
          fi
      - name: Build APKs
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/syncnotifications-signing/syncnotifications-android.jks
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -f "$ANDROID_SIGNING_STORE_FILE" ]]; then
            bash .github/scripts/gradle-step.sh assembleDebug assembleRelease
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo 'Fixed signing secrets unavailable to this pull request; building CI debug APK only.'
            unset ANDROID_SIGNING_STORE_FILE
            bash .github/scripts/gradle-step.sh assembleDebug
          else
            echo 'Fixed signing secrets are required for push builds.' >&2
            exit 1
          fi
      - name: Verify fixed signing certificate
        env:
          EXPECTED_CERT_SHA256: 3e422af3d30a5a4083b48f7ca5b1311be2af8fcf6187fd02a8541d3052f28f70
        run: |
          RELEASE_APK=app/build/outputs/apk/release/app-release.apk
          if [[ -f "$RELEASE_APK" ]]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
            "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK" \
              | tee "$RUNNER_TEMP/apksigner-output.txt"
            grep -qi "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" \
              "$RUNNER_TEMP/apksigner-output.txt"
          fi
      - name: Upload APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: syncnotifications-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  api29-secure-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run crypto, notification-action, and transport instrumentation on Android 10
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./gradlew :core-crypto:connectedDebugAndroidTest :core-notification:connectedDebugAndroidTest :core-transport:connectedDebugAndroidTest --console=plain
